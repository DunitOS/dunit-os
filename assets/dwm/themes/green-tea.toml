# Original dark palette and effects. Import in setup.
[theme]
desktop          = "#1E1E2E"
title_focused    = "#313244"
title_unfocused  = "#232331"
border_focused   = "#A6E3A1"
border_unfocused = "#45475A"
close            = "#F38BA8"
panel            = "#181825"
panel_text       = "#CDD6F4"
launcher         = "#A6E3A1"
taskbtn          = "#313244"
taskbtn_focused  = "#45475A"
menu             = "#11111B"
menu_hover       = "#45475A"
# Title-bar / taskbar label text. `title_text_focused` is the crisp TTF title on
# the active window (and the focused taskbar button); `_unfocused` is the dimmer
# variant on inactive windows. Were hardcoded 0xEAF2EC / 0xA8B4AC in gui_server.
title_text_focused   = "#EAF2EC"
title_text_unfocused = "#A8B4AC"

# Compositor effects; invalid values reject the preset with a diagnostic.
[effects]
corner_radius    = 8
shadow           = 7
shadow_alpha     = 90
blur             = true
blur_radius      = 4
blur_iters       = 2
panel_alpha      = 205
menu_alpha       = 225
gradient         = true
anim             = true
anim_ms          = 140

# Asset paths — everything the desktop loads by path, so it is fully config-
# driven (no hardcoded asset locations). `wallpaper` accepts SVG or 24-bit BMP
# and is painted as the backdrop (load failure → diagnostic/gradient fallback). `icon_theme` is a
# theme name under /assets/icons/<name>/, or absolute manifest path. The shared
# loader resolves theme.toml, ZIP/index.theme and aliases (or flat SVG/RGBA files
# for Aqua/legacy Breeze). `font` is the TrueType font
# every GUI app renders text with (missing/unparseable → explicit load failure). Paths must exist in the VFS; assets under /assets/ are embedded.

[layout]
dock_tile_alpha = 255
dock_edge = "left"
dock_centered = false
traffic_lights = false
show_workspaces = true
title_h = 26
border = 2
panel_h = 28
dock_w = 48
dock_gap = 0
dock_padding = 4
dock_margin = 0

[desktop]
sdk_theme = "/assets/dwm/sdk/dark.dss"
icon_theme = "breeze-chameleon-light"
wallpaper = "/assets/wallpapers/wallpaper.bmp"

[widgets]
enabled = true
