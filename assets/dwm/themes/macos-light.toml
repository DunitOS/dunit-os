# Desktop preset: editable TOML, applied by setup or Settings.
[theme]
desktop = "#DCE8F2"
title_focused = "#F7F7FA"
title_unfocused = "#E9E9ED"
border_focused = "#A8AFBA"
border_unfocused = "#CDD0D6"
close = "#FF5F57"
panel = "#F3F5F8"
panel_text = "#24262B"
launcher = "#007AFF"
taskbtn = "#E6E8ED"
taskbtn_focused = "#D3E5FC"
menu = "#F8F9FC"
menu_hover = "#D8E8FC"
title_text_focused = "#202124"
title_text_unfocused = "#70757D"
minimize = "#FFBD2E"
maximize = "#28C840"

[layout]
dock_tile_alpha = 0
title_h = 32
border = 1
panel_h = 26
dock_w = 68
dock_edge = "bottom"
dock_centered = true
dock_padding = 8
dock_gap = 8
dock_margin = 12
traffic_lights = true
show_workspaces = false

[effects]
corner_radius = 8
shadow = 16
shadow_alpha = 100
blur = true
blur_radius = 5
blur_iters = 2
panel_alpha = 235
menu_alpha = 240
gradient = true
anim = true
anim_ms = 180

[desktop]
wallpaper = "/assets/wallpapers/mojave.bmp"

[widgets]
enabled = false
