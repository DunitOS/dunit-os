# Dunit DWM system defaults (Stack B compositor).
#
# Loaded by gui_server at desktop start from /system/share/dwm/default.toml
# (loaded from initrd into MemFS). Unknown or invalid values are diagnosed and
# rejected. Missing files use dwm_settings defaults; an invalid live reload
# preserves the complete previous configuration.
#
# Colors are #RRGGBB or #AARRGGBB (alpha defaults to opaque). Geometry is in
# pixels.

# System desktop profile, loaded from /system/share/dwm/default.toml.
# Invalid reloads keep the previous state. Colors are RGB/ARGB; sizes are pixels.
# Schema 1 is migrated by the shared parser; future schemas are rejected.
[meta]
schema_version = 1

[theme]
maximize = "#28C840"
minimize = "#FFBD2E"
desktop = "#18243A"
title_focused = "#343436"
title_unfocused = "#2B2B2D"
border_focused = "#555558"
border_unfocused = "#38383B"
close = "#FF5F57"
panel = "#1D293E"
panel_text = "#F1F2F5"
launcher = "#0A84FF"
taskbtn = "#36363A"
taskbtn_focused = "#54545A"
menu = "#252527"
menu_hover = "#3D506C"
# Title colors inherit through shared DSS tokens.
title_text_focused = "#F2F2F4"
title_text_unfocused = "#98989E"

# Window decorations and shell geometry.
[layout]
dock_tile_alpha = 0
show_workspaces = false
traffic_lights = true
dock_margin = 12
dock_gap = 8
dock_padding = 8
dock_centered = true
dock_edge = "bottom"
title_h = 32
border = 1
panel_h = 26
# App-menu button width (holds the "Dunit" wordmark; workspace pips follow it).
launcher_w       = 92
menu_w           = 130
menu_item_h      = 26
dock_w = 68
ws_w             = 22
max_windows      = 8
# Shell font sizes: 6..64.
title_font_px    = 14
panel_font_px    = 13

# Set an effect to false or zero for the flat look.
[effects]
corner_radius = 8
shadow = 16
shadow_alpha = 100
blur = true
blur_radius = 5
blur_iters = 2
panel_alpha = 235
menu_alpha = 240
gradient = true
anim = true
anim_ms = 180

# Assets come from initrd/VFS. Icon themes support manifests, SVG and RGBA.
[desktop]
wallpaper = "/assets/wallpapers/mojave.svg"
icon_theme = "breeze-round-chameleon-dark"
font             = "/assets/fonts/DejaVuSans.ttf"
sdk_theme = "/assets/dwm/sdk/dark.dss"
# Missing logo falls back to the panel accent mark.
logo             = "/assets/images/logo.rgba"
themes = "/assets/dwm/themes"
palette          = "/assets/dwm/palettes/default.toml"

# Master switch and default corner: 0=TL, 1=TR, 2=BL, 3=BR.
# Individual widgets live in /system/share/dwm/widgets/*.toml.
[widgets]
enabled = false
corner  = 1

# Zero keeps the boot mode. A fixed framebuffer keeps its mode on request.
[display]
width  = 0
height = 0

# Panel and dock edges are independent.
[panel]
pos = "top"

# Matching panel/tray edges share one strip; otherwise the tray gets its own.
[tray]
pos  = "top"
size = 28

# Default bindings: modifier + 1..N/Space/Q/M for workspace/launcher/close/maximize.
# Launcher navigation uses Up/Down, Enter and Escape.
[shortcuts]
switcher   = true
switch_mod = "alt"
cmd_mod    = "super"
ws_switch  = true
launcher   = true
win_close  = true
win_max    = true

# Panel popup; toggles the live effect/widget flags. Escape dismisses it.
[quicksettings]
enabled = true

# Toast lifetime in milliseconds; corners use the widget convention.
[notifications]
enabled    = true
timeout_ms = 3000
corner     = 1

# Remember floating geometry by app ID. Persistence needs mounted /persist.
[session]
restore = true

# App IDs resolve against installed metadata; these tables supply desktop labels.
[application.gui_client]
name  = "Window"
label = "WIN"

[application.gui_demo]
name  = "Demo"
label = "DEMO"

[application.gui_calc]
name  = "Calculator"
label = "CALC"

[application.gui_stat]
name  = "System Monitor"
label = "STAT"

[application.gui_files]
open_formats = ["application/x-dunit-file-list"]
name  = "Files"
label = "FILE"

[application.gui_terminal]
name  = "Terminal"
label = "TERM"

[application.gui_settings]
open_formats = ["application/x-dunit-file-list"]
name  = "Settings"
label = "SET"

# Ordered pinned app IDs. Unknown IDs reject the document.
[dock]
entries = ["gui_demo", "gui_calc", "gui_stat", "gui_files", "gui_terminal", "gui_settings"]

# Ordered launcher entries.
[launcher]
terminal = "/app/gui_terminal"
entries = ["gui_demo", "gui_calc", "gui_stat", "gui_files", "gui_terminal", "gui_settings"]

# Start with no windows. test.toml owns the isolation smoke.
[startup]
entries = []

# Workspace count: 1..9.
[workspaces]
count = 5


# Optional Lua tiling worker, isolated with a deadline.
[scripts]
enabled = false
runner = "/app/dwm_lua"
layout = "/assets/dwm/scripts/columns.lua"
timeout_ms = 500

# Deadline for clipboard materialization, accepted drops and recipient completion.
[transfers]
timeout_ms = 5000
drag_threshold_px = 6

# Keep the full keypad usable when resizing Calculator.
[rules.calculator]
app = "gui_calc"
min_width = 192
min_height = 308
