name: Build Dunit OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # нужно для создания релизов

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            nasm \
            lld \
            xorriso \
            mtools \
            git \
            qemu-system-x86 \
            parted \
            dosfstools \
            ovmf

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/target
            userspace/system_apps/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Limine
        uses: actions/cache@v4
        with:
          path: limine
          key: limine-v8-binary

      - name: Native ABI and protocol contracts
        run: |
          python3 tools/gen_abi.py --check
          rustc --edition=2021 --test kernel/src/drivers/keyboard_queue.rs -o /tmp/dunit-keyboard-queue-test
          /tmp/dunit-keyboard-queue-test
          rustc --edition=2021 --test userspace/system_apps/gui_server/src/damage_plan.rs -o /tmp/dunit-damage-plan-test
          /tmp/dunit-damage-plan-test
          cargo test --manifest-path abi/wait-set/Cargo.toml
          cargo test --manifest-path protocols/gui-v1/Cargo.toml
          cargo test --manifest-path runtime/dunit-app-manifest/Cargo.toml
          bash tools/test_dwm_config_host.sh
          rustc --edition=2021 --crate-type rlib --crate-name term_theme runtime/term_theme/src/lib.rs -o /tmp/libterm_theme.rlib
          rustc --edition=2021 --test kernel/tests/terminal_display.rs --extern term_theme=/tmp/libterm_theme.rlib -o /tmp/dunit-terminal-display
          /tmp/dunit-terminal-display
          cargo test --manifest-path runtime/dunit-macros/Cargo.toml
          cargo test --manifest-path runtime/dunit-render/Cargo.toml
          cargo test --manifest-path runtime/dunit-component/Cargo.toml
          cargo test --manifest-path runtime/dunit/Cargo.toml --features gui

      - name: Image profile and SDK tooling tests
        run: |
          python3 tools/test_image_profiles.py
          python3 tools/test_dunit_cli.py

      - name: Native SDK workflow and failure contracts
        run: python3 tools/test_dunit_workflow.py --accel tcg

      - name: Native GUI SDK workflow and failure contracts
        run: python3 tools/test_dunit_gui_workflow.py --accel tcg

      - name: Native component input, CPU damage and resize
        run: python3 tools/test_sdk_gui_fixture.py component --accel tcg

      - name: Native SDK theme reload and framebuffer golden
        run: python3 tools/test_sdk_gui_fixture.py theme --accel tcg

      - name: Optional desktop catalog compatibility
        run: |
          (cd kernel && cargo build --release --features boot-smoke-tests \
            -Z build-std=core,alloc,compiler_builtins \
            -Z build-std-features=compiler-builtins-mem -Z json-target-spec)
          python3 tools/qemu_test.py --build --markers-file tools/sdk_catalog_absent_markers.json \
            --accel tcg --post-boot-delay 3 --settle 4 --timeout 300 --boot-timeout 180

      - name: Kernel interrupt after user fault
        run: |
          python3 tools/qemu_test.py --markers-file tools/user_fault_irq_markers.json \
            --accel tcg --post-boot-delay 3 --settle 4 --timeout 240 --boot-timeout 180

      - name: Installed desktop application catalog
        run: python3 tools/test_sdk_catalog.py --accel tcg

      - name: SDK resize during frame publication
        run: python3 tools/test_sdk_window_resize.py --accel tcg

      - name: Build DWM and Minimal ISOs
        run: bash build_iso.sh

      - name: Verify release image contents
        run: |
          python3 tools/check_image_profile.py build/dunit_dwm.iso dwm
          python3 tools/check_image_profile.py build/dunit_minimal.iso minimal

      - name: Boot Minimal release image
        run: |
          python3 tools/qemu_test.py --iso build/dunit_minimal.iso \
            --markers-file tools/minimal_markers.json --accel tcg \
            --boot-timeout 180 --cmd-timeout 60 --timeout 300

      - name: Boot DWM release image
        run: |
          python3 tools/qemu_test.py --iso build/dunit_dwm.iso \
            --markers-file tools/dwm_release_markers.json --accel tcg \
            --ready-marker 'gui_server: desktop ready' --linger 3 \
            --boot-timeout 240 --timeout 300

      - name: Boot both release images with UEFI
        run: |
          python3 tools/qemu_test.py --iso build/dunit_minimal.iso --uefi \
            --markers-file tools/minimal_markers.json --accel tcg \
            --boot-timeout 180 --cmd-timeout 60 --timeout 300
          python3 tools/qemu_test.py --iso build/dunit_dwm.iso --uefi \
            --markers-file tools/dwm_release_markers.json --accel tcg \
            --ready-marker 'gui_server: desktop ready' --linger 3 \
            --boot-timeout 240 --timeout 300

      # --- M0 CI budget: warnings must not grow, boot markers must hold ---
      - name: Compiler-warnings budget
        run: python3 tools/check_warnings.py

      - name: Boot marker budget (QEMU, TCG)
        run: |
          python3 tools/qemu_test.py --build \
            --markers-file tools/boot_markers.json \
            --accel tcg \
            --boot-timeout 180 \
            --cmd-timeout 60 \
            --timeout 420

      - name: Wait-set regression (QEMU, TCG)
        run: |
          python3 tools/qemu_test.py --markers-file tools/waitset_markers.json \
            --accel tcg --boot-timeout 180 --cmd-timeout 130 --timeout 300 \
            --post-boot-delay 3 --settle 4

      - name: Native SDK application APIs (QEMU, TCG)
        run: |
          python3 tools/qemu_test.py --markers-file tools/sdk_api_markers.json \
            --accel tcg --boot-timeout 180 --cmd-timeout 120 --timeout 360 \
            --post-boot-delay 3 --settle 4
          python3 tools/qemu_test.py --markers-file tools/sdk_entry_panic_markers.json \
            --accel tcg --boot-timeout 180 --cmd-timeout 60 --timeout 240 \
            --post-boot-delay 3 --settle 4

      - name: Native SDK monitor event loop (QEMU, TCG)
        run: |
          python3 tools/qemu_test.py --markers-file tools/sdk_event_loop_markers.json \
            --accel tcg --boot-timeout 180 --cmd-timeout 100 --timeout 300 \
            --post-boot-delay 3 --settle 1.5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: "Dunit OS build #${{ github.run_number }}"
          body: |
            Автосборка из коммита ${{ github.sha }}
            Ветка: ${{ github.ref_name }}
            dunit_dwm.iso — graphical desktop, apps and development tools.
            dunit_minimal.iso — terminal and base utilities, without DWM.
          files: |
            build/dunit_dwm.iso
            build/dunit_minimal.iso
          fail_on_unmatched_files: true
          draft: true
          prerelease: true

      - name: Publish complete two-image release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.sha }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort' > build/release-assets.json
          python3 -c 'import json; names=json.load(open("build/release-assets.json")); assert names == ["dunit_dwm.iso", "dunit_minimal.iso"], names'
          gh release edit "$RELEASE_TAG" --draft=false
