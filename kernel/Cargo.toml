[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
dunit_file_cap_abi = { path = "../abi/file-cap" }
dunit_pointer_abi = { path = "../abi/pointer-input" }
dunit_wait_abi = { path = "../abi/wait-set" }
bitflags = "2.11"
# Shared terminal color-theme presets (single source of truth), also linked by
# the userspace stack (dwm_settings -> gui_terminal). Pure const data, no_std.
term_theme = { path = "../runtime/term_theme" }

[features]
default = []
boot-smoke-tests = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
