# Native SDK GUI client; application state is separate from platform resources.
[package]
name = "gui_terminal"
version = "0.1.0"
edition = "2021"

[dependencies]
dunit = { path = "../../../runtime/dunit", features = ["gui"] }
dunit_shell = { path = "../../../runtime/dunit-shell" }
dwm_settings = { path = "../../dwm_settings" }
dunit_ui = { path = "../../../runtime/dunit-ui" }
dunit_widgets = { path = "../../../runtime/dunit-widgets" }

[[bin]]
name = "gui_terminal"
path = "src/main.rs"

# The SDK retained runtime is generic; link-time pruning keeps the existing ESP budget.
[profile.release]
lto = "fat"
opt-level = "z"
codegen-units = 1
