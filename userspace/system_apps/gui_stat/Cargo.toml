# Untrusted System Monitor using the native SDK component/window runtime.
[package]
name = "gui_stat"
version = "0.1.0"
edition = "2021"

[dependencies]
dunit = { path = "../../../runtime/dunit", features = ["gui"] }
dwm_settings = { path = "../../dwm_settings" }

[[bin]]
name = "gui_stat"
path = "src/main.rs"
