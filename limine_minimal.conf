timeout: 0
interface_resolution: 1024x768
interface_branding: Dunit Minimal
term_background: 101010
term_foreground: d0d0d0

/Dunit Minimal - Terminal
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    module_path: boot():/boot/initrd.img
    module_path: boot():/boot/installer-esp.img
    module_path: boot():/boot/installer-bios.bin
    cmdline: mode=terminal
    resolution: 1024x768x32
    kaslr: no
